<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f6f4;--surf:#ffffff;--surf2:#ececea;--text:#111;--mute:#77777a;--acc:#ff5a36;--line:#e2e2df;--ac:255,90,54;--bgc:246,246,244;--sfc:255,255,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--surf:#161618;--surf2:#222225;--text:#f2f2f0;--mute:#8d8d92;--line:#262629;--bgc:11,11,12;--sfc:22,22,24}}
:root[data-theme="dark"]{--bg:#0b0b0c;--surf:#161618;--surf2:#222225;--text:#f2f2f0;--mute:#8d8d92;--line:#262629;--bgc:11,11,12;--sfc:22,22,24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;transition:transform .12s cubic-bezier(.22,.8,.24,1),background-color .12s,opacity .12s,color .15s}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:14px 20px 6px;display:flex;align-items:center;justify-content:space-between;flex:none}
.tabs{display:flex;gap:18px;align-items:baseline}
.tab{font-size:25px;letter-spacing:.6px;font-weight:600;color:var(--mute);opacity:.65;padding:4px 0}
.tab.on{font-weight:800;color:var(--text);opacity:1}
.plus{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.25)}
.plus:active{transform:scale(.9)}
#tb{display:none;align-items:center;gap:10px;padding:6px 20px 8px;flex:none}
.sb{display:flex;align-items:center;height:44px;width:44px;border-radius:22px;background:var(--surf2);overflow:hidden;flex:none}
.sb.open{width:100%;flex:1}
.sbi,.sbx{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;display:none}
.sbx{display:none}
.sb.open input{display:block}.sb.open .sbx{display:flex}
#tb.so #flt{display:none}
#flt{margin-left:auto}
.pill{background:var(--surf2);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill.acc{background:var(--text);color:var(--bg)}
.pill:active{transform:scale(.95)}
#main{contain:layout style;flex:1;overflow-y:auto;padding:6px 20px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app.hm #main{padding-bottom:214px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{text-align:left;display:block;width:100%}
.card:active{transform:scale(.97)}
.cov{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:44px;color:#fff}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.card b{display:block;margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .1s,transform .15s cubic-bezier(.22,.8,.24,1),box-shadow .15s}
.row:active{background:var(--surf2)}
.row .n{width:20px;color:var(--mute);font-size:13px;text-align:center;flex:none}
.th{width:42px;height:42px;flex:none}
.th .cov{width:42px;height:42px;font-size:17px;border-radius:7px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--mute);font-size:13px}
.row.on .t b,.row.on .n{color:var(--acc)}
.row.drag{background:var(--surf2);box-shadow:0 6px 18px rgba(0,0,0,.3);position:relative;z-index:2;transform:scale(1.02);border-radius:10px}
.k{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.k:active{background:var(--surf2);transform:scale(.9)}
.ah{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 16px}
.ah .cov{width:72%;max-width:340px}
.ah h2{margin:14px 0 2px;font-size:24px}
.ah p{margin:0 0 14px;color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.back{color:var(--mute);font-size:15px;padding:6px 0;display:inline-flex;gap:2px;align-items:center}
.empty{text-align:center;color:var(--mute);padding:48px 20px;line-height:1.5}
.ic{width:24px;height:24px;fill:currentColor;display:block}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ib:active{transform:scale(.88)}
.tg{color:var(--mute)}
.tg.on{color:rgb(var(--ac))}

/* mini player */
#mini{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surf);border-radius:20px;display:none;flex-direction:column;padding:10px 10px 8px;z-index:4;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#mini::before{content:"";position:absolute;inset:0;background:rgb(var(--ac));opacity:.24;pointer-events:none}
#mini>*{position:relative}
.m1{display:flex;align-items:center;gap:10px;cursor:pointer}
.mcv{width:46px;height:46px;flex:none}
.mcv .cov{width:46px;height:46px;font-size:19px;border-radius:9px}
.m1 .t{flex:1;min-width:0}
.m1 .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1 .t span{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2{display:flex;align-items:center;margin-top:2px;gap:0}
.m2 .ib{width:38px;height:38px}
.mp{background:rgb(var(--ac));color:#fff}
.vl{display:flex;align-items:center;gap:6px;flex:1;min-width:70px;margin-left:8px;color:var(--mute)}
.vl .ic{width:18px;height:18px;flex:none}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgb(var(--ac));transform:scaleX(0);transform-origin:left;transition:transform .3s linear}

/* range sliders */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;--p:0%;--f:var(--text);--t:rgba(128,128,128,.35)}
.rng::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--f) var(--p),var(--t) var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--f);margin-top:-4px}
.rng::-moz-range-track{height:3px;border-radius:3px;background:var(--t)}
.rng::-moz-range-progress{height:3px;background:var(--f)}
.rng::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--f)}
.seek{--f:#fff;--t:rgba(255,255,255,.28)}

/* full player */
#full{position:absolute;inset:0;background:#0b0b0c;color:#fff;z-index:10;display:none;overflow-y:auto;overscroll-behavior:contain}
#full.open{display:block}
#fbg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bl{position:absolute;width:min(95vmax,900px);height:min(95vmax,900px);border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%);opacity:.9;transition:background-color .6s ease;will-change:transform;background:#444}
.b1{left:-45%;top:-25%;animation:d1 17s ease-in-out infinite alternate}
.b2{right:-55%;top:15%;animation:d2 21s ease-in-out infinite alternate}
.b3{left:-35%;bottom:-45%;animation:d3 24s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(22%,16%,0) scale(1.18)}}
@keyframes d2{to{transform:translate3d(-24%,12%,0) scale(.9)}}
@keyframes d3{to{transform:translate3d(20%,-18%,0) scale(1.12)}}
.bv{position:absolute;inset:0;background:rgba(0,0,0,.18)}
#fc{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:14px 24px calc(22px + env(safe-area-inset-bottom,0px))}
#fc .back{color:rgba(255,255,255,.8);align-self:flex-start;padding:6px 6px 6px 0}
.fcv{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0}
.fcv .cov{width:min(76vw,38dvh,340px);font-size:90px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.fti h2{margin:0 0 3px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fti p{margin:0;color:rgba(255,255,255,.65);font-size:15px;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsk{margin-top:14px}
.tm{display:flex;justify-content:space-between;color:rgba(255,255,255,.6);font-size:12px;margin-top:-2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.ctl .ib{width:50px;height:50px}
.ctl .big{width:66px;height:66px;background:#fff;color:#000}
#full .tg{color:rgba(255,255,255,.5)}
#full .tg.on{color:#fff}

/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.open{display:flex}
.ovg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:21;pointer-events:none}
.sheet{background:var(--surf);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .it{display:block;width:100%;text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);font-size:16px}
.sheet .it.dg{color:#e5484d}
.sheet .it.hi{display:flex;align-items:center;gap:14px}
.sheet .it.hi .ic{flex:none;color:var(--mute)}
.sheet .it.hi.dg .ic{color:#e5484d}
.sheet .it.hi .lb{flex:1;min-width:0}
.sheet .it:has(+ .gap){border-bottom:0}
.sheet .it.gap{margin-top:0;border-top:1px solid var(--line)}
.rord{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);touch-action:none;background:var(--surf)}
.rord .th{width:44px;height:44px;flex:none}.rord .th .cov{width:44px;height:44px;border-radius:8px;font-size:18px}
.rord .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.rord .hd{width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute);touch-action:none;cursor:grab}
.rord .mv{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.rord .mv[disabled]{opacity:.3}
.rord.dragging{opacity:.5}
#rolist{max-height:52dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet .it.sel{font-weight:700}
.sheet .it.sel::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:10px}
.sheet input[type=text]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.bt .mr{margin-right:auto}
.cvrow{display:flex;gap:14px;align-items:center}
.thumb{width:84px;flex:none}
.thumb .cov{font-size:30px;border-radius:10px}
.cvb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surf2);border-radius:999px;padding:8px 14px;font-size:14px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--text);color:var(--bg)}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.swb{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.swb.on{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--text)}
.swc{display:flex;align-items:center;gap:8px;margin:0!important;font-size:14px!important;color:var(--text)!important}
.swc input{width:36px;height:36px;border:0;padding:0;background:none}
.pl{max-height:52dvh;overflow-y:auto}
.pk{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);margin:0!important;font-size:15px!important;color:var(--text)!important}
.pk input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.pk .t{min-width:0}.pk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk small{color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.fold{position:relative;aspect-ratio:1;border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:10px;align-content:start;overflow:hidden;background:linear-gradient(rgba(var(--fa),.14),rgba(var(--fa),.14)),var(--surf2);color:rgb(var(--fa))}
.fc{aspect-ratio:1;border-radius:13px;overflow:hidden}
.fc .cov{width:100%;height:100%;font-size:20px;border-radius:0;aspect-ratio:auto}
.fe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.55}
.ah .fold{width:72%;max-width:340px}
.fcard{position:relative;transition:transform .12s cubic-bezier(.22,.8,.24,1)}
.fcard .card b{font-size:17px;margin-top:10px;padding-right:38px}
.fcard .card span{font-size:15px}
.fm{position:absolute;right:-6px;bottom:-4px;width:44px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.acard{position:relative;min-width:0}
.acard .card b{padding-right:30px}
.alm{position:absolute;right:-6px;bottom:-4px;width:38px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.alm:active{transform:scale(.9)}
.fcard.hot{transform:scale(1.05)}
.fcard.hot .fold{box-shadow:0 0 0 3px rgb(var(--fa))}
.back.hot{color:var(--acc);transform:translateX(-4px)}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);will-change:transform}
.ghost .cov{width:100%;height:100%;border-radius:0}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cov img{pointer-events:none;-webkit-user-drag:none}
.ab{width:40px;height:40px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center}
.ab.acc{background:var(--text);color:var(--bg)}
.ab:active{transform:scale(.9)}
.ah .acts{gap:6px}
.m2{justify-content:center;gap:4px}
.m3{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:var(--mute)}
.m3 span{min-width:30px;text-align:center}
.m3 .rng{height:30px;flex:1;min-width:0}
#vp{position:absolute;right:16px;width:190px;display:none;align-items:center;gap:10px;background:var(--surf);color:var(--mute);padding:8px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:6}
#vp.open{display:flex}
#vp .ic{flex:none}
.ftop{display:flex;align-items:center;justify-content:space-between}
.ftop .ib{color:rgba(255,255,255,.8)}
#vp{z-index:12}
.fr{display:flex}
#qp{position:absolute;inset:0;background:var(--bg);z-index:11;display:none;flex-direction:column}
#qp.open{display:flex}
.qh{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;flex:none}
.qh h3{margin:0;font-size:20px;flex:1}
.qa{display:flex;align-items:center;gap:4px}
#ql{flex:1;overflow-y:auto;padding:0 20px 30px;overscroll-behavior:contain}
.qs{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:18px 0 4px}
header{padding-top:46px}
#logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:29px;overflow:visible;z-index:15;pointer-events:none;color:var(--text);fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;transition:color .3s}
#logo .x{stroke:rgb(var(--lac,var(--ac)))}
#app:has(#full.open) #logo{color:#fff}
header{display:block;padding:8px 20px 2px}
.hr{display:flex;align-items:center;justify-content:space-between;height:46px}
.tabs{justify-content:center;gap:34px;padding:2px 0 6px}
#logo{top:17px}
#top{position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(rgba(var(--bgc),.9),rgba(var(--bgc),.66));-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
#main{padding-top:calc(var(--tp,130px) + 6px);overscroll-behavior-y:contain}
#full,#qp,#ql,.sheet,.pl{overscroll-behavior-y:contain}
.theme{display:flex;background:rgba(var(--sfc),.7);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.theme button{width:38px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.theme button.on{background:var(--text);color:var(--bg)}
.theme .ic{width:20px;height:20px}
.alink{display:inline !important;font-size:inherit !important;color:inherit !important;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(128,128,128,.55);text-underline-offset:2px}
.alink:active{opacity:.6}
.qk{position:absolute;right:20px;top:57px;width:44px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:rgba(var(--sfc),.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:2}
.qk .ic{width:20px;height:20px}
.qk:active{transform:scale(.92);color:var(--text)}

.plus{backdrop-filter:blur(10px)}
#flt{margin-left:auto;width:44px;height:44px;padding:0;justify-content:center;background:rgba(128,128,128,.18)}
#flt span{display:none}
.sb{background:rgba(128,128,128,.18)}
#mini{background:rgba(var(--sfc),.74);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(128,128,128,.2)}
.sheet{background:rgba(var(--sfc),.88);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}
#ov,.ovg{background:rgba(0,0,0,.42)}
#qp{background:rgba(var(--bgc),.97)}
#vp{background:rgba(var(--sfc),.82);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.toast{background:rgba(24,24,26,.86);color:#fff;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.ftop{justify-content:center}
#fc{padding-top:50px}
.fti{text-align:center}
.fbot{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:12px}
.fbot .ib{color:rgba(255,255,255,.85)}
.fvol{flex:1;max-width:170px;display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.7)}
.fvol .ic{flex:none;width:18px;height:18px}
.qh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.qh h3{text-align:center}
.qh .back{justify-self:start}
.qa{justify-self:end}
.tt,.tt *{transition:background-color .2s ease,color .2s ease,border-color .2s ease !important}
.mt{width:34px;height:34px}
#vp .ib,.fvol .ib{width:34px;height:34px}

/* importing */
const getDur=b=>new Promise(r=>{const a=new Audio(),u=URL.createObjectURL(b);a.preload='metadata';a.onloadedmetadata=()=>{r(a.duration);URL.revokeObjectURL(u)};a.onerror=()=>{r(0);URL.revokeObjectURL(u)};a.src=u});
/* duplicate detection: same title (ignoring case, accents, punctuation) or an identical file */
const nkey=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const fmtSize=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';
function findDup(s){
  const k=nkey(s.name);let best=null;
  for(const e of songs){
    if(e.id===s.id)continue;
    if(e.blob&&s.blob&&e.blob.size>0&&e.blob.size===s.blob.size&&Math.abs((e.dur||0)-(s.dur||0))<1)return {song:e,why:'file'};
    const ek=nkey(e.name),ea=nkey(artOf(e));
    if(!best&&k&&(k===ek||(ea&&k===ea+' '+ek)))best={song:e,why:'title'};
  }
  return best;
}
const freeName=n=>{let i=2,t;do{t=n+' ('+i+')';i++}while(songs.some(x=>nkey(x.name)===nkey(t)));return t};
/* Replace: the new file takes over the old song's name, artist, album, cover and playlist spots */
async function replaceSong(old,nw){
  const n={...old,id:nw.id,blob:nw.blob,dur:nw.dur};delete n.mod;
  songs=songs.filter(x=>x.id!==old.id);songs.push(n);
  await put('songs',n);await del('songs',old.id);
  for(const p of playlists)if((p.songs||[]).includes(old.id)){p.songs=p.songs.map(i=>i===old.id?n.id:i);await put('playlists',p)}
  const swap=a=>a.map(i=>i===old.id?n.id:i);queue=swap(queue);upNext=swap(upNext);if(ctxCur===old.id)ctxCur=n.id;
  if(cur===old.id){au.pause();au.removeAttribute('src');cur=null;closeFull()}
}

async function addFiles(files){
  const aud=[...files].filter(f=>f.type.startsWith('audio/')||/\.(mp3|wav|flac|m4a|aac|ogg|opus|wma|aiff?)$/i.test(f.name));
  let n=0,rep=0,skip=0,all=null,paused=false;
  for(let i=0;i<aud.length;i++){
    const f=aud[i];
    const s={id:uid(),name:f.name.replace(/\.[^.]+$/,''),artist:'',blob:f,album:null,dur:await getDur(f),added:Date.now()+n};
    const dup=findDup(s);
    if(dup){
      let r;
      if(all)r={act:all};
      else{
        if(!paused&&cur&&!au.paused){au.pause();paused=true}
        r=await dupDialog(dup,s,f,aud.length-1-i);
        if(r.all&&r.act!=='rename')all=r.act;
      }
      if(r.act==='skip'){skip++;continue}
      if(r.act==='replace'){await replaceSong(dup.song,s);rep++;continue}
      if(r.act==='rename')s.name=r.name;
    }
    songs.push(s);await put('songs',s);n++;
  }
  if(paused&&cur)au.play().catch(()=>{});
  const bits=[];if(n)bits.push(`Added ${n} ${n===1?'song':'songs'}`);if(rep)bits.push(`replaced ${rep}`);if(skip)bits.push(`skipped ${skip}`);
  toast(bits.length?bits.join(' \u00b7 ').replace(/^./,c=>c.toUpperCase()):'No audio files found');render();
}

function makeCover(file){return new Promise(res=>{
  const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d'),m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,400,400);URL.revokeObjectURL(u);
    let col=null;try{col=dominant(c)}catch(e){}
    res({data:c.toDataURL('image/jpeg',.82),color:col})};
  img.onerror=()=>res(null);img.src=u})}

let noClick=0,hold=null,drag=null;

function place(x,y){
  const t=document.elementFromPoint(x,y),row=t&&t.closest?t.closest('.row'):null;
  if(row&&row!==drag.el&&row.parentNode===drag.el.parentNode){
    const r=row.getBoundingClientRect();
    const all=[...document.querySelectorAll('#main .row')],tops=all.map(q=>q.getBoundingClientRect().top);
    if(y<r.top+r.height/2)row.parentNode.insertBefore(drag.el,row);else row.parentNode.insertBefore(drag.el,row.nextSibling);
    all.forEach((q,i)=>{const d=tops[i]-q.getBoundingClientRect().top;if(!d)return;const isD=q===drag.el;an(q,[{transform:'translateY('+d+'px)'+(isD?' scale(1.02)':'')},{transform:isD?'scale(1.02)':'none'}],{duration:230,easing:EASE})});

}

/* queue */
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function qadd(id,next){
  if(!songs.find(x=>x.id===id))return;
  if(cur===null){playSong(id,[id]);return}
  if(next)upNext.unshift(id);else upNext.push(id);
  toast(next?'Playing next':'Added to queue');if(qOpen)renderQueue();
}
function qaddMany(ids,next){
  if(cur===null){playSong(ids[0],ids);return}
  upNext=next?ids.concat(upNext):upNext.concat(ids);
  toast(`Added ${ids.length} ${ids.length===1?'song':'songs'} to the queue`);if(qOpen)renderQueue();
}
function qrow(s,k,i){
  const acts=k==='now'?'':`<button class="k" data-act="qtop" data-k="${k}" data-i="${i}" aria-label="Play next">${ic('up',20)}</button><button class="k" data-act="qrm" data-k="${k}" data-i="${i}" aria-label="Remove from queue">${ic('close',20)}</button>`;
  return `<div class="row ${k==='now'?'on':''}" data-act="qplay" data-k="${k}" data-i="${i}"><div class="th">${cover(songCover(s),s.name)}</div><div class="t"><b>${esc(s.name)}</b><span>${esc(sub(s)||'No album')}</span></div>${acts}</div>`;
}
function renderQueue(){
  const l=$('#ql');if(!l)return;const keep=l.scrollTop,s=songs.find(x=>x.id===cur);
  const ci=queue.indexOf(ctxCur),ctx=ci<0?[]:queue.slice(ci+1).map((id,j)=>({id,i:ci+1+j}));
  let h='<div class="qs">Now playing</div>'+(s?qrow(s,'now',0):'<div class="empty">Nothing is playing.</div>');
  if(upNext.length)h+=`<div class="qs">Next in queue<span>${upNext.length}</span></div>`+upNext.map((id,i)=>{const x=songs.find(q=>q.id===id);return x?qrow(x,'up',i):''}).join('');
  if(ctx.length)h+=`<div class="qs">Next up<span>${ctx.length}</span></div>`+ctx.map(o=>{const x=songs.find(q=>q.id===o.id);return x?qrow(x,'ctx',o.i):''}).join('');
  if(!upNext.length&&!ctx.length)h+='<div class="empty">The queue is empty.<br>Use Play next or Add to queue on any song.</div>';
  l.innerHTML=h;l.scrollTop=keep;
}
function openQ(){
  qOpen=true;const p=$('#qp');p.getAnimations().forEach(x=>x.cancel());p.classList.add('open');renderQueue();
  an(p,[{transform:'translateY(100%)'},{transform:'none'}],{duration:400,easing:EASE_OUT});
  [...$('#ql').querySelectorAll('.row')].slice(0,12).forEach((r,i)=>an(r,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{duration:340,delay:120+i*26,easing:EASE_OUT,fill:'backwards'}));
}
function closeQ(){
  qOpen=false;const p=$('#qp');if(!p.classList.contains('open'))return;
  const a=an(p,[{transform:'none'},{transform:'translateY(100%)'}],{duration:300,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'});
  if(a)a.onfinish=()=>{p.classList.remove('open');a.cancel()};else p.classList.remove('open');
}

/* select mode and bulk actions */
let selMode=false;const selSet=new Set();
function updateBar(){const c=$('#selc');if(c)c.textContent=selSet.size+' selected';const b=document.querySelector('[data-act=selall]');if(b){const l=songsList();b.textContent=l.length&&l.every(x=>selSet.has(x.id))?'Deselect all':'Select all'}}
async function bulkAlbum(ids){
  const opts=albums.map(a=>({label:a.name,value:a.id,cov:a}));opts.push({label:'New album',value:'__new',plus:true});opts.push({label:'No album',value:'__none'});
  const t=await choose('Add '+ids.length+(ids.length===1?' song':' songs')+' to album',opts);if(!t)return false;
  let aid=null;
  if(t==='__new'){const f=await albumForm('New album',null,'Create');if(!f)return false;aid=newAlbum(f.name,null,f.artist).id}else if(t!=='__none')aid=t;
  let p=Date.now();for(const id of ids){const s=songs.find(x=>x.id===id);if(s){s.album=aid;s.pos=p++;await put('songs',s)}}
  toast('Updated '+ids.length+(ids.length===1?' song':' songs'));return true;
}
function pickColor(title){return new Promise(res=>{
  let c;
  openOv(`<h3>${esc(title)}</h3><div class="sw" id="pcw"><button type="button" class="swb auto" data-c="" aria-label="Automatic color">${ic('close',14)}</button>${PAL.map(x=>`<button type="button" class="swb" data-c="${x}" style="background:${x}" aria-label="Color ${x}"></button>`).join('')}<label class="swc" aria-label="Custom color"><input type="color" id="pcc" value="#ff5a36">${ic('palette',16)}</label></div><div class="bt"><button class="pill" id="pcx">Cancel</button><button class="pill acc" id="pco">Apply</button></div>`);
  const mark=()=>{document.querySelectorAll('#pcw .swb').forEach(b=>b.classList.toggle('on',c!==undefined&&(b.dataset.c||'').toLowerCase()===(c||'').toLowerCase()));$('#pcw .swc').classList.toggle('on',!!c&&!PAL.some(p=>p.toLowerCase()===c.toLowerCase()))};
  $('#pcw').onclick=e=>{const b=e.target.closest('.swb');if(!b)return;c=b.dataset.c;mark()};
  $('#pcc').oninput=e=>{c=e.target.value;mark()};
  const close=v=>{closeOv();res(v)};
  $('#pcx').onclick=()=>close(null);
  $('#pco').onclick=()=>close(c===undefined?null:c);
  $('#ov').onclick=e=>{if(e.target.id==='ov')close(null)};
})}
async function bulkColor(ids){
  const c=await pickColor('Color for '+ids.length+(ids.length===1?' song':' songs'));if(c===null)return false;
  for(const id of ids){const s=songs.find(x=>x.id===id);if(s){s.color=c||null;await put('songs',s)}}
  toast('Color updated');return true;
}
function bulkTag(ids){return new Promise(res=>{
  openOv(`<h3>Tag ${ids.length} ${ids.length===1?'song':'songs'}</h3><label for="ta">Artist</label><input type="text" id="ta" maxlength="120" placeholder="Keep current"><label for="tf">Featuring artist (added to each song)</label><input type="text" id="tf" maxlength="120" placeholder="None"><label for="tl">Album</label><input type="text" id="tl" maxlength="80" placeholder="Keep current"><div class="chips" id="tch">${albums.map(a=>`<button type="button" class="chip" data-n="${esc(a.name)}">${esc(a.name)}</button>`).join('')}</div><div class="bt"><button class="pill" id="tx">Cancel</button><button class="pill acc" id="to">Apply</button></div>`);
  $('#tch').onclick=e=>{const c=e.target.closest('.chip');if(c)$('#tl').value=c.dataset.n};
  const close=v=>{closeOv();res(v)};
  $('#tx').onclick=()=>close(false);
  $('#to').onclick=async()=>{
    const ar=$('#ta').value.trim(),al=$('#tl').value.trim(),ft=$('#tf').value.replace(/\s+/g,' ').trim();
    if(!ar&&!al&&!ft)return close(false);
    let aid=null;if(al){const ex=albums.find(a=>a.name.toLowerCase()===al.toLowerCase());aid=ex?ex.id:newAlbum(al).id}
    let p=Date.now();
    for(const id of ids){const s=songs.find(x=>x.id===id);if(!s)continue;if(ar)s.artist=ar;if(ft){const f=featOf(s).slice();if(!f.some(x=>sameArt(x,ft)))f.push(ft);s.feat=f}if(ar||ft)s.feat=featOf(s).filter(x=>!sameArt(x,s.artist||''));if(aid){s.album=aid;s.pos=p++}await put('songs',s)}
    toast('Tags updated');close(true);
  };
  $('#ov').onclick=e=>{if(e.target.id==='ov')close(false)};
})}

async function bulkDelete(ids){
  const r=await choose('Delete '+ids.length+(ids.length===1?' song?':' songs?'),[{label:'Delete from library',value:1,danger:true}]);if(!r)return false;
  const set=new Set(ids);
  for(const id of ids)await del('songs',id);
  await purgePl(ids);
  songs=songs.filter(s=>!set.has(s.id));queue=queue.filter(x=>!set.has(x));upNext=upNext.filter(x=>!set.has(x));
  if(set.has(cur)){au.pause();au.removeAttribute('src');cur=null;closeFull()}
  toast('Deleted '+ids.length+(ids.length===1?' song':' songs'));return true;
}
function selIds(){const l=songsList().filter(s=>selSet.has(s.id)).map(s=>s.id);return l.concat([...selSet].filter(id=>!l.includes(id)))}

const fmtDate=t=>new Date(t).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
const fmtLen=s=>{const hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=Math.round(s%60);return hh?hh+'h '+mm+'m':mm+'m '+ss+'s'};

/* volume and mute */
let lastVol=1;
function paintVol(){const z=au.volume===0;document.querySelectorAll('.mt2').forEach(e=>e.classList.toggle('on',z));document.querySelectorAll('[data-vi]').forEach(e=>{const k=z?'volx':'vol';if(e.dataset.k!==k){e.dataset.k=k;e.innerHTML=ic(k,+e.dataset.s||20)}})}
function setVol(v){v=Math.max(0,Math.min(1,v));au.volume=v;if(v>0)lastVol=v;const p=Math.round(v*100);['#vol','#fvol','#mvl'].forEach(q=>{const r=$(q);if(r){r.value=p;r.style.setProperty('--p',p+'%')}});paintVol()}
function toggleMute(){const c=au.volume;if(c>0){lastVol=c;setVol(0)}else setVol(lastVol||1);vpTimer()}

/* theme */
function curTheme(){return document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintTheme(){const t=curTheme();document.querySelectorAll('#theme button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0b0b0c':'#f6f6f4'}
function setTheme(t,save){const r=document.documentElement;r.classList.add('tt');r.dataset.theme=t;if(save)try{localStorage.setItem('tracks-theme',t)}catch(e){}paintTheme();setTimeout(()=>r.classList.remove('tt'),260)}

/* static UI and init */
function ui(){
  try{const t=localStorage.getItem('tracks-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}
  $('#plus').innerHTML=ic('plus',26);$('#qk').innerHTML=ic('qm',22);
  $('#app').insertAdjacentHTML('beforeend',`<div id="selbar"><div class="sr"><button class="ib" data-act="selexit" aria-label="Done">${ic('close',22)}</button><span id="selc">0 selected</span><button class="pill" data-act="selall">All</button></div><div class="sg"><button class="ib" data-act="selalbum" aria-label="Add to album">${ic('addpl',24)}</button><button class="ib" data-act="selpl" aria-label="Add to playlist">${ic('plist',22)}</button><button class="ib" data-act="selqueue" aria-label="Add to queue">${ic('qm',23)}</button><button class="ib" data-act="selcolor" aria-label="Change color">${ic('palette',22)}</button><button class="ib" data-act="seltag" aria-label="Tag artist and album">${ic('tag',22)}</button><button class="ib" data-act="seldel" aria-label="Delete songs">${ic('trash',22)}</button></div></div>`);
  $('#theme').children[0].innerHTML=ic('sun',20);$('#theme').children[1].innerHTML=ic('moon',20);paintTheme();
  new ResizeObserver(()=>document.documentElement.style.setProperty('--tp',$('#top').offsetHeight+'px')).observe($('#top'));
  $('#tb').innerHTML=`<div class="sb" id="sb"><button class="sbi" data-act="search" aria-label="Search">${ic('search',22)}</button><input id="sq" type="search" placeholder="Search songs, artists, albums" autocomplete="off"><button class="sbx" data-act="clearsearch" aria-label="Close search">${ic('close',20)}</button></div><button class="pill" id="selbtn" data-act="select" aria-label="Select songs">${ic('sel',20)}</button><button class="pill" id="flt" data-act="filter">${ic('filter',18)}<span id="fl"></span></button>`;
  $('#sq').oninput=()=>{view.q=$('#sq').value;render()};
  $('#sq').onblur=()=>{if(!$('#sq').value)closeSearch()};
  $('#mini').innerHTML=`<div class="m1"><div class="mcv" id="mc"></div><div class="t"><b id="mt"></b><span id="ms"></span></div><button class="ib" data-act="minialbum" aria-label="Add to album">${ic('addpl',24)}</button></div>
  <div class="m3"><span id="mct">0:00</span><input type="range" class="rng" id="msk" min="0" max="1000" value="0" style="--f:rgb(var(--ac))" aria-label="Seek"><span id="mdt">0:00</span></div><div class="m2"><button class="ib" data-act="vol" data-vi data-s="22" aria-label="Volume">${ic('vol',22)}</button><div class="mvs"><input type="range" class="rng" id="mvl" min="0" max="100" value="${Math.round(au.volume*100)}" style="--p:${Math.round(au.volume*100)}%;--f:rgb(var(--ac))" aria-label="Volume"><button class="ib mt2" data-act="mute" aria-label="Mute or unmute">${ic('volx',16)}</button></div><button class="ib tg" data-act="shuffle" aria-label="Shuffle"></button><button class="ib" data-act="prev" aria-label="Previous">${ic('prev',24)}</button><button class="ib mp" id="mp" data-act="toggle" aria-label="Play or pause"></button><button class="ib" data-act="next" aria-label="Next">${ic('next',24)}</button><button class="ib tg" data-act="repeat" aria-label="Repeat"></button><button class="ib" data-act="qopen" aria-label="Queue">${ic('qm',22)}</button></div>`;
  $('#app').insertAdjacentHTML('beforeend',`<div id="vp"><button class="ib mt" data-act="mute" data-vi data-s="20" aria-label="Mute or unmute">${ic('vol',20)}</button><input type="range" class="rng" id="vol" min="0" max="100" value="${Math.round(au.volume*100)}" style="--p:${Math.round(au.volume*100)}%" aria-label="Volume"></div>`);
  $('#vol').oninput=e=>{setVol(e.target.value/100);vpTimer()};
  $('#mvl').oninput=e=>{setVol(e.target.value/100);vpTimer()};
  $('#msk').oninput=e=>{if(au.duration)au.currentTime=e.target.value/1000*au.duration;e.target.style.setProperty('--p',(e.target.value/10)+'%');$('#mct').textContent=fmt(au.currentTime)};
  $('#msk').onpointerdown=()=>{seeking=true};
  $('#app').insertAdjacentHTML('beforeend',`<div id="qp"><div class="qh"><button class="back" data-act="qclose" aria-label="Close queue">${ic('down',28)}</button><h3>Queue</h3><div class="qa"><button class="ib" data-act="qshuf" aria-label="Shuffle upcoming songs">${ic('shuffle',22)}</button><button class="pill" data-act="qclear">Clear</button></div></div><div id="ql"></div></div>`);
  $('#mini .m1').addEventListener('click',e=>{if(e.target.closest('[data-act]'))return;openFull()});
  syncCtl();
}
(async()=>{
  try{db=await openDB();songs=(await tx('songs','readonly',s=>s.getAll()))||[];albums=(await tx('albums','readonly',s=>s.getAll()))||[];folders=(await tx('folders','readonly',s=>s.getAll()))||[];playlists=(await tx('playlists','readonly',s=>s.getAll()))||[];pfolders=(await tx('pfolders','readonly',s=>s.getAll()))||[]}catch(e){db=null}
  songs.sort((a,b)=>a.added-b.added);
  ui();applyBg();render();
  $('#plus').insertAdjacentHTML('afterend',`<button class="ib" id="cb" data-act="cloud" aria-label="Google Drive sync" style="margin-left:10px;margin-right:auto">${ic('cloud',24)}</button>`);
  parseTok();if(LS('tracks-cloud')){cloudSt('Connected');if(navigator.onLine)cloudSync(false)}
  if(!db)toast('Storage unavailable, songs last until you close this page');
  for(const o of [...songs,...albums]){
    if(o.cover&&!o.ccol){const c=await colorFromUrl(o.cover);if(c){o.ccol=c;await put(songs.includes(o)?'songs':'albums',o)}}
  }
  renderMini();
})();
</script>
