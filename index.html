<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tracks</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style id="tspcss">
#tsp{position:fixed;inset:0;z-index:2147483000;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;transition:opacity .2s ease-out}
#tsp .tspl{position:absolute;left:50%;top:50%;width:min(66vw,380px);height:auto;transform:translate(-50%,-50%);overflow:visible}
#tsp .tp{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1.02}
#tsp .tp.tpr{stroke:#f00}
#tsp.run .tp{animation:tspd var(--t) var(--d) linear both}
@keyframes tspd{to{stroke-dashoffset:0}}
#tsp.rm .tp{stroke-dashoffset:0;animation:none!important}
#tsp.go{opacity:0;pointer-events:none}
</style>
<style>
:root{--bg:#f6f6f4;--surf:#ffffff;--surf2:#ececea;--text:#111;--mute:#5c5c61;--acc:#ff5a36;--acct:#ff5a36;--line:#e2e2df;--ac:255,90,54;--bgc:246,246,244;--sfc:255,255,255;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--surf:#161618;--surf2:#222225;--text:#f2f2f0;--mute:#8d8d92;--line:#262629;--bgc:11,11,12;--sfc:22,22,24}}
:root[data-theme="dark"]{--bg:#0b0b0c;--surf:#161618;--surf2:#222225;--text:#f2f2f0;--mute:#8d8d92;--line:#262629;--bgc:11,11,12;--sfc:22,22,24}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;overscroll-behavior-y:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation;transition:transform .12s cubic-bezier(.22,.8,.24,1),background-color .12s,opacity .12s,color .15s}
#app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}
header{padding:14px 20px 6px;display:flex;align-items:center;justify-content:space-between;flex:none}
.tabs{display:flex;gap:18px;align-items:baseline}
.tab{font-size:25px;letter-spacing:.6px;font-weight:600;color:var(--mute);opacity:.65;padding:4px 0}
.tab.on{font-weight:800;color:var(--text);opacity:1}
.plus{width:44px;height:44px;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px var(--line),0 4px 14px rgba(0,0,0,.25)}
.plus:active{transform:scale(.9)}
.plus.off{background:var(--surf2);color:var(--mute);box-shadow:none;opacity:.5;cursor:default}
.plus.off:active{transform:none}
#tb{display:none;align-items:center;gap:10px;padding:6px 20px 8px;flex:none}
.sb{display:flex;align-items:center;height:44px;width:44px;border-radius:22px;background:var(--surf2);overflow:hidden;flex:none}
.sb.open{width:100%;flex:1}
.sbi,.sbx{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.sb input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;display:none}
.sbx{display:none}
.sb.open input{display:block}.sb.open .sbx{display:flex}
#tb.so #flt{display:none}
#flt{margin-left:auto}
.pill{background:var(--surf2);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill.acc{background:var(--text);color:var(--bg)}
.pill:active{transform:scale(.95)}
#main{contain:layout style;flex:1;overflow-y:auto;padding:6px 20px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#app.hm #main{padding-bottom:214px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{text-align:left;display:block;width:100%}
.card:active{transform:scale(.97)}
.cov{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:44px;color:#fff}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.card b{display:block;margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{color:var(--mute);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:background-color .1s,transform .15s cubic-bezier(.22,.8,.24,1),box-shadow .15s}
.row:active{background:var(--surf2)}
.row .n{width:20px;color:var(--mute);font-size:13px;text-align:center;flex:none}
.th{width:42px;height:42px;flex:none}
.th .cov{width:42px;height:42px;font-size:17px;border-radius:7px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t span{color:var(--mute);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{color:var(--mute);font-size:13px}
.row.on .t b,.row.on .n{color:var(--acct)}
.row.drag{background:var(--surf2);box-shadow:0 6px 18px rgba(0,0,0,.3);position:relative;z-index:2;transform:scale(1.02);border-radius:10px}
.k{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.k:active{background:var(--surf2);transform:scale(.9)}
.ah{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 16px}
.ah .cov{width:72%;max-width:340px}
.ah h2{margin:14px 0 2px;font-size:24px}
.ah p{margin:0 0 14px;color:var(--mute);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.back{color:var(--mute);font-size:15px;padding:6px 0;display:inline-flex;gap:2px;align-items:center}
.empty{text-align:center;color:var(--mute);padding:48px 20px;line-height:1.5}
.ic{width:24px;height:24px;fill:currentColor;display:block}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.ib:active{transform:scale(.88)}
.tg{color:var(--mute)}
.tg.on{color:rgb(var(--ac))}

/* mini player */
#mini{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surf);border-radius:20px;display:none;flex-direction:column;padding:10px 10px 8px;z-index:4;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.28)}
#mini::before{content:"";position:absolute;inset:0;background:rgb(var(--ac));opacity:.24;pointer-events:none}
#mini>*{position:relative}
.m1{display:flex;align-items:center;gap:10px;cursor:pointer}
.mcv{width:46px;height:46px;flex:none}
.mcv .cov{width:46px;height:46px;font-size:19px;border-radius:9px}
.m1 .t{flex:1;min-width:0}
.m1 .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m1 .t span{font-size:12px;color:var(--mute);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m2{display:flex;align-items:center;margin-top:2px;gap:0}
.m2 .ib{width:38px;height:38px}
.mp{background:rgb(var(--ac));color:#fff}
.vl{display:flex;align-items:center;gap:6px;flex:1;min-width:70px;margin-left:8px;color:var(--mute)}
.vl .ic{width:18px;height:18px;flex:none}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgb(var(--ac));transform:scaleX(0);transform-origin:left;transition:transform .3s linear}

/* range sliders */
.rng{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;--p:0%;--f:var(--text);--t:rgba(128,128,128,.35)}
.rng::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--f) var(--p),var(--t) var(--p))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--f);margin-top:-4px}
.rng::-moz-range-track{height:3px;border-radius:3px;background:var(--t)}
.rng::-moz-range-progress{height:3px;background:var(--f)}
.rng::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--f)}
.seek{--f:#fff;--t:rgba(255,255,255,.28)}

/* full player */
#full{position:absolute;inset:0;background:#0b0b0c;color:#fff;z-index:10;display:none;overflow-y:auto;overscroll-behavior:contain}
#full.open{display:block}
#fbg{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.bl{position:absolute;width:min(95vmax,900px);height:min(95vmax,900px);border-radius:50%;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 68%);mask-image:radial-gradient(circle,#000 0,transparent 68%);opacity:.9;transition:background-color .6s ease;will-change:transform;background:#444}
.b1{left:-45%;top:-25%;animation:d1 17s ease-in-out infinite alternate}
.b2{right:-55%;top:15%;animation:d2 21s ease-in-out infinite alternate}
.b3{left:-35%;bottom:-45%;animation:d3 24s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate3d(22%,16%,0) scale(1.18)}}
@keyframes d2{to{transform:translate3d(-24%,12%,0) scale(.9)}}
@keyframes d3{to{transform:translate3d(20%,-18%,0) scale(1.12)}}
.bv{position:absolute;inset:0;background:rgba(0,0,0,.18)}
#fc{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:14px 24px calc(22px + env(safe-area-inset-bottom,0px))}
#fc .back{color:rgba(255,255,255,.8);align-self:flex-start;padding:6px 6px 6px 0}
.fcv{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 0}
.fcv .cov{width:min(76vw,38dvh,340px);font-size:90px;box-shadow:0 22px 50px rgba(0,0,0,.45)}
.fti h2{margin:0 0 3px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fti p{margin:0;color:rgba(255,255,255,.65);font-size:15px;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fsk{margin-top:14px}
.tm{display:flex;justify-content:space-between;color:rgba(255,255,255,.6);font-size:12px;margin-top:-2px}
.ctl{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
.ctl .ib{width:50px;height:50px}
.ctl .big{width:66px;height:66px;background:#fff;color:#000}
#full .tg{color:rgba(255,255,255,.5)}
#full .tg.on{color:#fff}

/* sheets */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.open{display:flex}
.ovg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:21;pointer-events:none}
.sheet{background:var(--surf);width:100%;max-width:640px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:86dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet h3{margin:0 0 10px;font-size:16px}
.sheet .it{display:block;width:100%;text-align:left;padding:15px 8px;border-bottom:1px solid var(--line);font-size:16px}
.sheet .it.dg{color:#e5484d}
.sheet .it.hi{display:flex;align-items:center;gap:14px}
.sheet .it.hi .ic{flex:none;color:var(--mute)}
.sheet .it.hi.dg .ic{color:#e5484d}
.sheet .it.hi .lb{flex:1;min-width:0}
.sheet .it:has(+ .gap){border-bottom:0}
.sheet .it.gap{margin-top:0;border-top:1px solid var(--line)}
.rord{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);touch-action:none;background:var(--surf)}
.rord .th{width:44px;height:44px;flex:none}.rord .th .cov{width:44px;height:44px;border-radius:8px;font-size:18px}
.rord .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.rord .hd{width:36px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--mute);touch-action:none;cursor:grab}
.rord .mv{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surf2)}
.rord .mv[disabled]{opacity:.3}
.rord.dragging{opacity:.5}
#rolist{max-height:52dvh;overflow-y:auto;overscroll-behavior:contain}
.sheet .it.sel{font-weight:700}
.sheet .it.sel::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:10px}
.sheet input[type=text]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;font-size:16px}
.sheet label{display:block;font-size:12px;color:var(--mute);margin:12px 0 4px}
.bt{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.bt .mr{margin-right:auto}
.cvrow{display:flex;gap:14px;align-items:center}
.thumb{width:84px;flex:none}
.thumb .cov{font-size:30px;border-radius:10px}
.cvb{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surf2);border-radius:999px;padding:8px 14px;font-size:14px;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:var(--text);color:var(--bg)}
.sw{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:4px}
.swb{width:36px;height:36px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.swb.on{box-shadow:0 0 0 3px var(--surf),0 0 0 5px var(--text)}
.swc{display:flex;align-items:center;gap:8px;margin:0!important;font-size:14px!important;color:var(--text)!important}
.swc input{width:36px;height:36px;border:0;padding:0;background:none}
.pl{max-height:52dvh;overflow-y:auto}
.pk{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);margin:0!important;font-size:15px!important;color:var(--text)!important}
.pk input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.pk .t{min-width:0}.pk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk small{color:var(--mute);font-size:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%}
.fold{position:relative;aspect-ratio:1;border-radius:24px;padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:min-content;gap:10px;align-content:start;overflow:hidden;background:linear-gradient(rgba(var(--fa),.14),rgba(var(--fa),.14)),var(--surf2);color:rgb(var(--fa))}
.fc{aspect-ratio:1;border-radius:13px;overflow:hidden}
.fc .cov{width:100%;height:100%;font-size:20px;border-radius:0;aspect-ratio:auto}
.fe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:.55}
.ah .fold{width:72%;max-width:340px}
.fcard{position:relative;transition:transform .12s cubic-bezier(.22,.8,.24,1)}
.fcard .card b{font-size:17px;margin-top:10px;padding-right:38px}
.fcard .card span{font-size:15px}
.fm{position:absolute;right:-6px;bottom:-4px;width:44px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.acard{position:relative;min-width:0}
.acard .card b{padding-right:30px}
.alm{position:absolute;right:-6px;bottom:-4px;width:38px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.alm:active{transform:scale(.9)}
.fcard.hot{transform:scale(1.05)}
.fcard.hot .fold{box-shadow:0 0 0 3px rgb(var(--fa))}
.back.hot{color:var(--acct);transform:translateX(-4px)}
.ghost{position:fixed;left:0;top:0;z-index:40;pointer-events:none;border-radius:14px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);will-change:transform}
.ghost .cov{width:100%;height:100%;border-radius:0}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.cov img{pointer-events:none;-webkit-user-drag:none}
.ab{width:40px;height:40px;border-radius:50%;background:var(--surf2);display:flex;align-items:center;justify-content:center}
.ab.acc{background:var(--text);color:var(--bg)}
.ab:active{transform:scale(.9)}
.ah .acts{gap:6px}
.m2{justify-content:center;gap:4px}
.m3{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:var(--mute)}
.m3 span{min-width:30px;text-align:center}
.m3 .rng{height:30px;flex:1;min-width:0}
#vp{position:absolute;right:16px;width:190px;display:none;align-items:center;gap:10px;background:var(--surf);color:var(--mute);padding:8px 16px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:6}
#vp.open{display:flex}
#vp .ic{flex:none}
.ftop{display:flex;align-items:center;justify-content:space-between}
.ftop .ib{color:rgba(255,255,255,.8)}
#vp{z-index:12}
.fr{display:flex}
#qp{position:absolute;inset:0;background:var(--bg);z-index:11;display:none;flex-direction:column}
#qp.open{display:flex}
.qh{display:flex;align-items:center;gap:8px;padding:12px 16px 6px;flex:none}
.qh h3{margin:0;font-size:20px;flex:1}
.qa{display:flex;align-items:center;gap:4px}
#ql{flex:1;overflow-y:auto;padding:0 20px 30px;overscroll-behavior:contain}
.qs{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin:18px 0 4px}
header{padding-top:46px}
#logo{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:92px;height:29px;overflow:visible;z-index:15;pointer-events:none;color:var(--text);fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;transition:color .3s}
#logo .x{stroke:rgb(var(--lac,var(--ac)))}
#app:has(#full.open) #logo{color:#fff}
header{display:block;padding:8px 20px 2px}
.hr{display:flex;align-items:center;justify-content:space-between;height:46px}
.tabs{justify-content:center;gap:34px;padding:2px 0 6px}
#logo{top:17px}
#top{position:absolute;top:0;left:0;right:0;z-index:6;background:linear-gradient(rgba(var(--bgc),.9),rgba(var(--bgc),.66));-webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
#main{padding-top:calc(var(--tp,130px) + 6px);overscroll-behavior-y:contain}
#full,#qp,#ql,.sheet,.pl{overscroll-behavior-y:contain}
.theme{display:flex;background:rgba(var(--sfc),.7);border:1px solid var(--line);border-radius:999px;padding:3px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.theme button{width:38px;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.theme button.on{background:var(--text);color:var(--bg)}
.theme .ic{width:20px;height:20px}
.alink{display:inline !important;font-size:inherit !important;color:inherit !important;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(128,128,128,.55);text-underline-offset:2px}
.alink:active{opacity:.6}
.qk{position:absolute;right:20px;top:57px;width:44px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--mute);background:rgba(var(--sfc),.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);z-index:2}
.qk .ic{width:20px;height:20px}
.qk:active{transform:scale(.92);color:var(--text)}

.plus{backdrop-filter:blur(10px)}
#flt{margin-left:auto;width:44px;height:44px;padding:0;justify-content:center;background:rgba(128,128,128,.18)}
#flt span{display:none}
.sb{background:rgba(128,128,128,.18)}
#mini{background:rgba(var(--sfc),.74);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(128,128,128,.2)}
.sheet{background:rgba(var(--sfc),.88);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4)}
#ov,.ovg{background:rgba(0,0,0,.42)}

.fedit{position:absolute;right:-8px;top:50%;transform:translateY(-50%)}
.fedit:active{transform:translateY(-50%) scale(.88)}

/* background customizing */
.bl{opacity:var(--bo,.9);width:calc(min(95vmax,900px)*var(--bz,1));height:calc(min(95vmax,900px)*var(--bz,1));animation-play-state:var(--aps,running)}
.b1{animation-duration:calc(17s/var(--spd,1))}
.b2{animation-duration:calc(21s/var(--spd,1))}
.b3{animation-duration:calc(24s/var(--spd,1))}
.bv{background:rgba(0,0,0,var(--dim,.18))}
.bimg{filter:blur(var(--cb,46px)) saturate(1.45)}
.bimg.on{opacity:var(--bio,.7)}
.bgr{position:absolute;inset:0;display:none;animation:gm 18s ease-in-out infinite alternate;animation-duration:calc(18s/var(--spd,1));animation-play-state:var(--aps,running)}
@keyframes gm{to{background-position:100% 100%}}
#fbg.st-grad .bgr{display:block;background:linear-gradient(160deg,rgb(var(--c0,60,60,60)),rgb(var(--c1,40,40,40)) 50%,rgb(var(--c2,20,20,20)) 100%);background-size:220% 220%}
#fbg.st-solid .bgr{display:block;background:rgb(var(--c3,30,30,30));animation:none}
#fbg.st-blobs .bimg,#fbg.st-grad .bimg,#fbg.st-solid .bimg{display:none}
#fbg.st-grad .bl,#fbg.st-solid .bl{display:none}
.bgst{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.bgs .fop{margin:6px 0}
.bgs .fop span{width:88px;flex:none}
.bgs .fop b{min-width:44px}
#fbg:not(.st-img):not(.st-mix) .bcus{display:none}
#fbg.st-img.hascus .bimg:not(.bcus),#fbg.st-mix.hascus .bimg:not(.bcus){display:none}
#fbg.st-img.hascus .bl,#fbg.st-img.hascov .bl{display:none}
#bgimgrow{display:none;margin-top:10px}

/* playlists */
.tab{font-size:clamp(13px,3.9vw,22px);letter-spacing:.3px}
.tabs{gap:clamp(10px,3.6vw,26px);padding-left:54px;padding-right:54px}
.cov.pm{position:relative;display:block}
.pmos{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.pmos img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.pmc{font-style:normal;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.5em;min-width:0;min-height:0}
.fbot{gap:4px}
.fbot .fg{display:flex}

/* featuring artists + duplicate popup */
.chips.wrap{flex-wrap:wrap;overflow:visible}
/* suggested artists: wrap into a short box that scrolls up and down (wheel, touch or the thin bar), so every known artist is reachable */
.chips.sgl{flex-wrap:wrap;overflow-x:hidden;overflow-y:auto;max-height:96px;padding:6px 2px 4px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.5) transparent}
.chips.sgl::-webkit-scrollbar{display:block;width:6px}
.chips.sgl::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:3px}
.chip.fx{display:inline-flex;align-items:center;gap:6px}
.chip.fx .ic{width:12px;height:12px}
.ftrow{display:flex;gap:8px;align-items:center}
.sheet .ftrow input{flex:1;min-width:0;width:auto}
.dupn{margin:2px 6px 0;color:var(--mute);font-size:13px;line-height:1.4}
.dtag{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:12px 6px 5px}
.dupc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:rgba(128,128,128,.14)}
.dupc .th{width:46px;height:46px}
.dupc .th .cov{width:46px;height:46px;border-radius:8px;font-size:18px}
.dupc .t{flex:1;min-width:0}
.dupc .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dupc .t span{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvb{position:relative;overflow:hidden;flex:none;display:flex;align-items:center;gap:5px;height:38px;padding:0 13px 0 10px;border-radius:999px;background:var(--text);color:var(--bg);font-size:13px;font-weight:600;white-space:nowrap}
.pvb .ic{width:16px;height:16px}
.pvb:active{transform:scale(.94)}
.pvb:disabled{opacity:.4;background:var(--surf2);color:var(--mute)}
.pvb i{position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--acc);transform:scaleX(0);transform-origin:left}
.dsum{margin:10px 6px 4px;font-size:12px;color:var(--mute);line-height:1.4}
.sheet .pk.dall{display:flex;margin:6px 0 2px!important;padding:10px 6px!important;border-bottom:0}

/* v9: unified folder bar, compact picker, mini hide */
.fbr{gap:8px}
.fbr .back,.fbr .ab{width:40px;height:40px;border-radius:14px;flex:none}
.fbr .ft{flex:1;min-width:0;text-align:left}
.fbr .ft h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbr .ft span{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.fbr .abtns{gap:8px;flex:none}
.fsz2{display:flex;gap:2px;padding:3px;border-radius:14px;background:rgba(128,128,128,.18)}
.fsz2 button{width:28px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.fsz2 button.on{background:var(--text);color:var(--bg)}
.abar .ab.acc{background:var(--text);color:var(--bg)}
.pkh{display:flex;gap:8px;align-items:center;margin:2px 0 4px}
.sheet .pkh input[type=text]{flex:1;min-width:0;width:auto}
.pc{max-height:50dvh}
.pr{display:flex;align-items:center;gap:10px;padding:7px 4px;border-bottom:1px solid rgba(128,128,128,.14);cursor:pointer;user-select:none;-webkit-user-select:none}
.pr:active{background:rgba(128,128,128,.14)}
.pr .ck{flex:none;margin:0}
.pr .pn{flex:1;min-width:0;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr small{flex:0 1 38%;min-width:0;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
#mini{padding-top:16px;transition:transform .38s cubic-bezier(.22,.8,.24,1)}
#mini>.mhide{position:absolute;top:0;left:50%;margin-left:-24px;width:48px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--mute);z-index:2}
.mhide .ic{transform:rotate(-90deg)}
#mshow{position:absolute;left:50%;margin-left:-26px;bottom:10px;width:52px;height:30px;border-radius:999px;display:none;align-items:center;justify-content:center;z-index:4;color:var(--text);background:rgba(var(--sfc),.74);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(128,128,128,.22);box-shadow:0 4px 16px rgba(0,0,0,.25)}
#mshow .ic{transform:rotate(90deg)}
#mshow:active{transform:scale(.92)}
#app.mh #mini{transform:translateY(calc(100% + 24px));pointer-events:none}
#app.hm.mh #mshow{display:flex}
#app.hm.mh #main{padding-bottom:64px}
#app.selmode.hm.mh #main{padding-bottom:150px}
#app.selmode #mshow{display:none!important}

/* v9: cover transition */
#full{overflow-x:hidden}
#fc{overflow:hidden}
.fcv{position:relative}
.trpv{position:relative;width:112px;height:112px;margin:8px auto 12px}
.trl{position:absolute;inset:0;border-radius:14px;overflow:hidden;background:var(--surf2);box-shadow:0 8px 20px rgba(0,0,0,.3)}
.trin{width:100%;height:100%}
.trin .cov{width:100%;height:100%;border-radius:0;font-size:44px}
.trin.tralt{filter:hue-rotate(150deg) saturate(1.15)}
.bgs .fop.tr span{width:88px}
.fbot{display:grid;grid-template-columns:minmax(88px,1fr) auto minmax(88px,1fr);gap:4px}
.fbot .fg{justify-self:start}
.fbot>.ib{justify-self:end}
.fvol{flex:none;width:min(150px,calc(100vw - 232px));max-width:none}
.fvol{position:relative;display:block;width:min(110px,calc(100vw - 232px))}
.fvol .mt{position:absolute;right:100%;top:50%;transform:translateY(-50%);width:28px;height:28px;margin-right:2px}
.fvol .mt:active{transform:translateY(-50%) scale(.88)}
.fvol .rng{display:block}

/* v10: beat effects */
.rsb{width:28px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--mute)}
.rsb .ic{width:16px;height:16px}
.rsb:active{transform:scale(.85)}
.fop.dflt .rsb{opacity:.25;pointer-events:none}
.fxcv{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:-1}
.fxpv{position:relative;isolation:isolate;height:170px;margin:4px 0 8px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:rgba(128,128,128,.12)}
.fxpv .cov{width:92px;height:92px;font-size:36px;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.bgs .fop.fx span{width:88px}
.chip.mt2{opacity:.55}.chip.mt2.on{opacity:1}
/* v21: big player volume = one centred unit (icon + bar) that fills the space between the side buttons and never overlaps them */
.fbot{grid-template-columns:minmax(88px,1fr) minmax(0,220px) minmax(88px,1fr);column-gap:10px}
.fbot .fvol{position:relative;display:flex;align-items:center;gap:2px;width:100%;max-width:220px;min-width:0;margin:0;justify-self:center}
.fbot .fvol .mt{position:static;transform:none;flex:none;width:30px;height:30px;margin:0}
.fbot .fvol .mt:active{transform:scale(.88)}
.fbot .fvol .rng{flex:1;min-width:0;height:34px;display:block}
.fbot .fvol .rng::-webkit-slider-runnable-track{height:4px;border-radius:4px}
.fbot .fvol .rng::-webkit-slider-thumb{width:15px;height:15px;margin-top:-5.5px}
.fbot .fvol .rng::-moz-range-track{height:4px;border-radius:4px}
.fbot .fvol .rng::-moz-range-progress{height:4px;border-radius:4px}
.fbot .fvol .rng::-moz-range-thumb{width:15px;height:15px}
html[data-layout=pc] .fbot .fvol{flex:1;width:auto;max-width:210px;margin:0 6px}
/* v20: normalize volume button */
.nmb{position:relative;opacity:.5;transition:opacity .2s,color .2s}
.nmb.on{opacity:1}
#mini .nmb.on{color:rgb(var(--ac))}
.fnm{position:absolute;right:38px;top:50%;transform:translateY(-50%)}
.fnm:active{transform:translateY(-50%) scale(.88)}
.fnm.on{color:#fff}
html[data-layout=pc] #fc .ftop .fnm{order:4}
.nmb.on::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.nmb.busy .ic{animation:nmp .9s ease-in-out infinite}
@keyframes nmp{50%{opacity:.25}}
/* v19: frequency picker (EQ style) */
.fxeq{position:relative;border-radius:14px;overflow:hidden;background:rgba(128,128,128,.12);margin-top:4px;touch-action:none;-webkit-user-select:none;user-select:none}
.fxeq canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair;color:var(--text)}
.fxhint{margin:6px 2px 0;font-size:11px;line-height:1.35;color:var(--mute)}
.fxtab{display:inline-flex;align-items:center;gap:7px}
.fxtab i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.fxtab.mu{opacity:.55}.fxtab.mu i{opacity:.45}
.fxhz{display:flex;gap:10px}.fxhz>div{flex:1;min-width:0}
.fxhz label{margin-top:8px}
.chip[disabled]{opacity:.35;pointer-events:none}

/* settings button + sheet */
.gear{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text);background:rgba(var(--sfc),.7);border:1px solid var(--line);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.gear:active{transform:scale(.9) rotate(30deg)}
.gear .ic{width:24px;height:24px}
.setr{display:flex;gap:8px;margin:4px 0 8px}
.setg{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:rgba(var(--bgc),.45);border:1px solid var(--line);color:var(--mute);font-size:13px;font-weight:600}
.setg.on{background:var(--text);color:var(--bg);border-color:transparent}
.setg:active{transform:scale(.95)}

/* PC mode: whole app uses the full screen */
html[data-layout=pc]{--px:max(clamp(28px,4vw,72px),calc((100% - 1640px)/2))}

/* PC mode, round 2: every tab and the player */
html[data-layout=pc] header{padding-top:52px}

html[data-layout=pc] #main .row{display:grid;grid-template-columns:44px 48px minmax(0,2fr) minmax(0,1.3fr) 92px 44px;column-gap:16px;align-items:center;padding:8px 14px}

/* PC header toolbar: [create][sync] ........ tabs ........ [queue][settings] */
html[data-layout=pc] .hr{height:52px;gap:12px}

/* trim and loop sheet */

.trsl::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:var(--f);box-shadow:0 2px 8px rgba(0,0,0,.35)}

/* smooth cuts (join parts and loop) */
.cf{margin:14px 0 2px;padding:10px 12px 12px;border-radius:14px;border:1px dashed rgba(var(--sc),.55)}

.tmcols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 4px}

.tmc{min-width:0;padding:10px;border-radius:14px;background:rgba(128,128,128,.1)}

.trc .trx{margin:10px 0 2px}
.trc .trx .pill.acc{background:var(--text);color:var(--bg)}

/* missing info */

<script>
/* traX launch splash: the logo writes itself fast, then fades into the app */
(function(){
  var sp=document.getElementById('tsp');if(!sp)return;
  var T=0.50,ready=false,wrote=false,gone=false,rm=false;
  try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
  function go(){if(gone)return;gone=true;sp.classList.add('go');setTimeout(function(){var d=document.getElementById('tspcss');sp.remove();if(d)d.remove()},350)}
  function tryGo(){if(ready&&wrote)go()}
  window.splashReady=function(){ready=true;tryGo()};
  function start(){
    if(rm){sp.classList.add('rm');wrote=true;setTimeout(tryGo,200);return}
    sp.classList.add('run');
    setTimeout(function(){wrote=true;tryGo()},T*1000+60);
  }
  requestAnimationFrame(function(){requestAnimationFrame(start)});
  setTimeout(function(){ready=true;wrote=true;go()},9000);

/* normalize volume (v2)
   - Loudness is measured once per song with the ITU BS.1770 K-weighting (shelf + high-pass), 400 ms blocks with 75% overlap and the two standard gates, then cached.
   - The song is normalized BEFORE you hear it: a song that is not measured yet starts silent, is measured (usually well under a second or two), rewinds to where it began and only then lets the sound through.
   - The next songs in the queue are measured in the background, so most songs start instantly at the right level.
   - The correction is a gain node after the beat-effect analysers (visuals are unaffected). Boosts never push the peaks past full scale.
   - Tap the button to switch on/off. Hold it (or right-click) for the target level and "analyse whole library". */

const nm={on:0,db:0,key:null,hold:null,busy:0,tk:0,all:0};

function nmEnsure(say,fresh){
  if(!nm.on){nm.hold=null;nm.busy=0;if(nm.db)nmSet(0,true);else nmPaint();return}
  const s=songById(cur);if(!s||!s.blob)return;
  const key=s.id+':'+s.blob.size;
  if(nm.key===key){if(say)toast('Volume normalized ('+nmTxt(nm.db)+')');return}
  if(nm.hold===key)return;
  if(!fxGraph()){nm.busy=0;nmPaint();if(say)toast('Normalize is not supported in this browser');return}   /* built right here, inside the tap */
  const my=++nm.tk,e=nmEntry(s);nm.hold=null;
  if(e){nm.key=key;nm.busy=0;nmSet(nmGain(e),!!fresh);nmWarm();if(say)toast('Volume normalized ('+nmTxt(nm.db)+')');return}
  nm.key=null;nm.busy=1;

  if(fresh){nm.hold=key;nm.db=0;nmLevel(0)}else nmSet(0);

async function nmAll(){

  if(h[0]===73&&h[1]===68&&h[2]===51)return id3(await blob.slice(0,((h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9])+10).arrayBuffer());
  if(h[0]===0x66&&h[1]===0x4c&&h[2]===0x61&&h[3]===0x43)return flacTags(blob);
  if(h[0]===0x4f&&h[1]===0x67&&h[2]===0x67&&h[3]===0x53)return oggTags(blob);
  if(h[4]===0x66&&h[5]===0x74&&h[6]===0x79&&h[7]===0x70)return mp4Tags(blob);
  return {};
}

let noClick=0,hold=null,drag=null;

function place(x,y){
  const t=document.elementFromPoint(x,y),row=t&&t.closest?t.closest('.row'):null;
  if(row&&row!==drag.el&&row.parentNode===drag.el.parentNode){
    const r=row.getBoundingClientRect();
    const all=[...document.querySelectorAll('#main .row')],tops=all.map(q=>q.getBoundingClientRect().top);
    if(y<r.top+r.height/2)row.parentNode.insertBefore(drag.el,row);else row.parentNode.insertBefore(drag.el,row.nextSibling);
    all.forEach((q,i)=>{const d=tops[i]-q.getBoundingClientRect().top;if(!d)return;const isD=q===drag.el;an(q,[{transform:'translateY('+d+'px)'+(isD?' scale(1.02)':'')},{transform:isD?'scale(1.02)':'none'}],{duration:230,easing:EASE})});
    renumber();
  }
}
function startDrag(){

    const m=$('#main');

/* Block Android pull-to-refresh: cancel downward swipes when the touched scroller is already at the top */
(()=>{let y0=0,sc=null;

  if(el.scrollHeight>el.clientHeight+1){const o=getComputedStyle(el).overflowY;if(o==='auto'||o==='scroll')return el}}

function preApply(d){
  const x=JSON.parse(JSON.stringify(d));
  Object.assign(ICP,icDef(),x.icp||{});if(ICP.pos.gear==='off')ICP.pos.gear='hr';icSave();
  Object.assign(FP,fpSanitize(x.fp));fpSave();
  if(x.np){NP.on=!!x.np.on;NP.ly=x.np.ly!==false;if(x.np.w)NP.w=x.np.w;LS('tracks-np',NP.on?'1':'0');LS('tracks-npl',NP.ly?'1':'0');LS('tracks-npw',String(NP.w))}
  DKC.on=!!x.dkc;LS('tracks-dockc',x.dkc?'1':'0');LS('tracks-dockw',x.dkw||'');LS('tracks-dockh',x.dkh||'');
  if(x.hbm)setHbm(x.hbm);
  setDock(DOCKS.includes(x.dock)?x.dock:'top');
  try{hbPlace()}catch(e){}try{npApply()}catch(e){}fpApply();

function preClick(t,paint){
  let b;

  if(t.closest('[data-presave]')){ask('Name this preset','','Save').then(n=>{if(n){const a=PRE_LOAD();a.push({id:'u'+Date.now(),name:n,d:preSnap()});LS(PRE_KEY,JSON.stringify(a));toast('Preset saved')}setTimeout(icSheet,300)});return true}
  if(b=t.closest('[data-prepl]')){const a=PRE_LOAD(),x=a.find(q=>q.id===b.dataset.prepl);if(x){x.d=preSnap();LS(PRE_KEY,JSON.stringify(a));toast('Preset updated with the current layout')}return true}
  if(b=t.closest('[data-predel]')){LS(PRE_KEY,JSON.stringify(PRE_LOAD().filter(q=>q.id!==b.dataset.predel)));paint();return true}
  if(b=t.closest('[data-fpgo]')){const full=b.dataset.fpgo==='full';closeOv();setTimeout(()=>{fpEdit(true);if(full)fpMode('full')},380);return true}
  if(t.closest('[data-fpclr]')){FP.p={};FP.b={};fpSaveNow();try{dockSync()}catch(_){}fpApply(true);paint();return true}
  return false;
}

/* the editor panel: drag it by its header, it always stays on screen and above everything else; it can be collapsed to a single bar */
function fpClampBar(){const b=$('#fpbar');if(!b)return;const r=b.getBoundingClientRect();b.style.left=Math.max(8,Math.min(innerWidth-r.width-8,r.left))+'px';b.style.top=Math.max(8,Math.min(innerHeight-r.height-8,r.top))+'px'}
let fpRo=null;
function fpPlaceBar(){
  const b=$('#fpbar');if(!b)return;let p=null;try{p=JSON.parse(LS('tracks-fpbar')||'null')}catch(e){}
  const r=b.getBoundingClientRect();b.style.transform='none';
  const wide=innerWidth>=700;/* wide screens: out of the way on the right; phones: centred */
  b.style.left=(p&&isFinite(p.x)?p.x:wide?innerWidth-r.width-16:(innerWidth-r.width)/2)+'px';b.style.top=(p&&isFinite(p.y)?p.y:wide?Math.max(70,(innerHeight-r.height)/3):(innerHeight-r.height)/2)+'px';
  fpClampBar();
  try{if(fpRo)fpRo.disconnect();fpRo=new ResizeObserver(fpClampBar);fpRo.observe(b)}catch(e){}
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest&&e.target.closest('#fpgrip');if(!g||e.target.closest('button')||!fpOn()||e.button>0)return;
  const b=$('#fpbar'),r=b.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top;e.preventDefault();
  try{g.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{b.style.left=Math.max(8,Math.min(innerWidth-r.width-8,ev.clientX-ox))+'px';b.style.top=Math.max(8,Math.min(innerHeight-b.offsetHeight-8,ev.clientY-oy))+'px'};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);LS('tracks-fpbar',JSON.stringify({x:parseFloat(b.style.left),y:parseFloat(b.style.top)}))};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});

/* rotate the selected item: drag the round handle above it (snaps every 15 degrees, hold Alt for free rotation) */
function fpRot(){
  document.querySelectorAll('.fprot').forEach(x=>x.remove());
  const el=FPSEL;if(!fpOn()||!el||el.id==='main'||!el.isConnected)return;
  const r=el.getBoundingClientRect();if(!r.width)return;
  const p=FP.p[el.dataset.fpk]||{},a=(p.r||0)*Math.PI/180,cx=r.left+r.width/2,cy=r.top+r.height/2,hh=el.offsetHeight?el.offsetHeight*(p.s||100)/200:r.height/2,R=hh+26;
  const x=Math.max(12,Math.min(innerWidth-12,cx+Math.sin(a)*R)),y=Math.max(12,Math.min(innerHeight-12,cy-Math.cos(a)*R));
  document.body.insertAdjacentHTML('beforeend',`<i class="fprot" style="left:${Math.round(x-9)}px;top:${Math.round(y-9)}px" title="Drag to rotate" aria-label="Rotate"></i>`);
}
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest&&e.target.closest('.fprot');if(!h||!fpOn()||!FPSEL)return;
  e.preventDefault();e.stopPropagation();if(fpBusy||e.button>0||e.isPrimary===false)return;
  const el=FPSEL,k=el.dataset.fpk,r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,pre=fpSnap(),pid=e.pointerId;
  fpBusyOn();
  const mv=ev=>{
    if(ev.pointerId!==pid)return;
    let a=Math.atan2(ev.clientY-cy,ev.clientX-cx)*180/Math.PI+90;a=((a+540)%360)-180;
    if(!ev.altKey){const n=Math.round(a/15)*15;if(Math.abs(a-n)<4)a=n}
    const p=fpMk(k);p.r=Math.round(a);fpOne(el,p);fpRot();
    fpSync();
  };
  const up=ev=>{if(ev&&ev.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);fpBusyOff();fpClean(k);fpCommit(pre);fpSave();fpSync();fpRot()};
  addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up);
},true);
/* watches the parts of the interface that get rebuilt (mini player, side player, bars, full player) and puts the placement back.
   Only real element changes count, not the time text that ticks every second, so this costs nothing during playback. */
function fpInit(){
  let q=0;
  const go=()=>{q=0;fpApply();if(fpOn())fpList()};
  const mo=new MutationObserver(recs=>{
    if(q)return;
    for(const r of recs){for(const n of r.addedNodes){if(n.nodeType===1){q=requestAnimationFrame(go);return}}}
  });
  ['#mini','#npb','#np','#dock','#top','#fc'].forEach(x=>{const n=$(x);if(n)mo.observe(n,{childList:true,subtree:true})});
  fpApply();setTimeout(fpRescue,1200);
}

/* big player top bar menu: one button opens a pill (background, cover transition, beat effects) centred on the bar */
function tbmPlace(w){
  const p=w.querySelector('.tbmp'),bar=w.parentElement;if(!p||!bar)return;
  const wr=w.getBoundingClientRect(),br=bar.getBoundingClientRect(),pw=p.offsetWidth,m=8;
  let dx=br.left+br.width/2-pw/2-wr.left;
  const l=wr.left+dx;dx+=Math.max(0,m-l)-Math.max(0,l+pw-(innerWidth-m));
  p.style.left=dx+'px';p.style.setProperty('--ox',(wr.width/2-dx)+'px');
}
function tbmSet(open){
  const w=$('#fc .tbm');if(!w)return;
  if(open===w.classList.contains('open'))return;
  if(open)tbmPlace(w);
  w.classList.toggle('open',open);
  const b=w.querySelector('.tbmb'),p=w.querySelector('.tbmp');
  b.classList.toggle('on',open);b.setAttribute('aria-expanded',String(open));p.setAttribute('aria-hidden',String(!open));
}

  const stop=()=>{clearTimeout(t);if(btn){btn.classList.remove('qhold');btn=null}};

(function(){

  dock.insertAdjacentHTML('afterbegin','<div id="dkg" role="separator" aria-label="Drag to resize the bar" title="Drag to make the bar smaller"></div>');
  const g=$('#dkg');let st=null;
  g.addEventListener('pointerdown',e=>{
    if(e.button)return;const d=getDock(),r=dock.getBoundingClientRect();
    st={id:e.pointerId,d,r,mx:dkMax()};g.setPointerCapture(e.pointerId);document.documentElement.classList.add('dkdrag');e.preventDefault();
  });
  g.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const {d,r,mx}=st;let v=d==='left'?e.clientX-r.left:d==='right'?r.right-e.clientX:r.bottom-e.clientY;
    const mn=d==='bottom'?54:58;v=Math.round(Math.min(mx,Math.max(mn,v)));

  });
  const end=e=>{if(!st||(e&&e.pointerId!==st.id))return;st=null;document.documentElement.classList.remove('dkdrag');dockSync();if(typeof npApply==='function')npApply()};
  g.addEventListener('pointerup',end);g.addEventListener('pointercancel',end);
  g.addEventListener('dblclick',()=>{LS(dkKey(),'');dockSync();if(typeof npApply==='function')npApply()});/* double-click: back to normal size */
  document.querySelectorAll('.tab').forEach(t=>{t.title=t.textContent.trim()});
  dockSync();
})();

function tpbApply(){

  if(!TPB.c&&TPB.t===null&&TPB.b===null){r.removeAttribute('data-tpb');r.removeAttribute('data-tpt');['--tpc','--tpa','--tpbl'].forEach(k=>s.removeProperty(k));return}

/* ===== Trim sheet: waveform you can play and skip through, trim handles, a smooth section loop, and per-song fades ===== */
/* ===== Section loop: repeats a part of the song a few extra times. The jump is a short equal-power crossfade
   between two players: the main one fades out at the loop end while a second one, parked and ready at the loop start,
   fades in. Then the main player moves to where the second one is and takes over again. ===== */
const LPX=.25;
function lpStop(){
  clearInterval(LP.iv);LP.iv=0;

  if(g){try{g.pause();g.removeAttribute('src');g.load()}catch(_){}}

}
function lpPrep(blob,a){

function lpJump(el,vs,gn,X,a){
  const g=LP.g;if(!g||LP.busy)return false;
  LP.busy=1;LP.vs=vs;
  const vol=()=>xfCl(uvol*gn());
  let ph=0,t0=0,t1=0,tries=0,lead=.1;
  g.volume=0;
  const start=()=>{if(ph)return;ph=1;t0=performance.now();LP.iv=setInterval(step,16)};
  g.addEventListener('playing',start,{once:true});setTimeout(start,240);
  g.play().catch(()=>{if(LP.g===g){lpStop();try{el.currentTime=a}catch(_){}}});
  const done=()=>{ph=3;t1=performance.now()};
  const hand=()=>{
    tries++;

/* ===== Tempo detection: onset envelope (low band + high band) -> autocorrelation for the tempo -> comb search for the exact BPM and where beat 1 falls.
   Returns {bpm, off (seconds of a beat line), conf (about 1 = random, 2.5+ = clear beat)} or null. ===== */
function bpmDetect(ab){

    const m=sum/n||1;for(let i=0;i<n;i++)o[i]/=m;return o;
  };
  const o1=prep(el),o2=prep(ef);if(!o1&&!o2)return null;
  const on=new Float32Array(n);for(let i=0;i<n;i++)on[i]=(o1?o1[i]:0)+(o2?o2[i]*.5:0);
  /* keep only the peaks: subtract a moving average */
  {const W=Math.max(2,Math.round(fr*.4)),cs=new Float64Array(n+1);for(let i=0;i<n;i++)cs[i+1]=cs[i]+on[i];
   const out=new Float32Array(n);for(let i=0;i<n;i++){const a0=Math.max(0,i-W),b0=Math.min(n,i+W+1),mean=(cs[b0]-cs[a0])/(b0-a0),v=on[i]-mean;out[i]=v>0?v:0}on.set(out)}
  /* analyse at most 5 minutes from the middle of the song */
  let i0=0,m=n;const cap=Math.floor(fr*300);if(n>cap){i0=Math.floor((n-cap)/2);m=cap}
  const env=on.subarray(i0,i0+m);

/* ===== share a song as a link =====
   Sender: the audio (and a small cover) go to the sender's Drive as "anyone with the link can view". The link is
   <app>/?play=<audioId>[.<coverId>]&t=<title>&a=<artist>&f=<feat|feat>.
   Receiver: the app opens on a play card that streams the file straight from Drive (nothing is saved or downloaded),
   with Add song / Export song / decline (X). Reading a public Drive file needs GKEY, a Google API key limited to the Drive API. */
const SH_API='https://www.googleapis.com/drive/v3/files/',SH_KEY='tracks-shared';

/* ---- sender ---- */
async function shFolder(){
  let f=LS('tracks-shfid');
  if(f){try{const j=await (await gapi(DV+'/'+f+'?fields=trashed')).json();if(!j.trashed)return f}catch(e){if(shAuthErr(e))throw e}}
  const q=encodeURIComponent("name='Tracks shared' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  const j=await (await gapi(DV+'?q='+q+'&fields=files(id)')).json();
  f=j.files[0]?j.files[0].id:(await (await gapi(DV,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Tracks shared',mimeType:'application/vnd.google-apps.folder'})})).json()).id;
  LS('tracks-shfid',f);return f;
}
function shPut(url,blob,type,on){return new Promise((res,rej)=>{
  const x=new XMLHttpRequest();x.open('PUT',url);x.setRequestHeader('Content-Type',type);
  x.upload.onprogress=e=>{if(on&&e.lengthComputable)on(e.loaded/e.total)};
  x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText).id)}catch(e){rej(new Error('Upload failed'))}}else rej(new Error('Upload '+x.status))};
  x.onerror=()=>rej(new Error('Upload failed. Check your connection'));x.send(blob)})}
async function shUp(name,blob,type,parent,on){
  type=type||'application/octet-stream';
  const r=await gapi(DU+'?uploadType=resumable&fields=id',{method:'POST',headers:{'Content-Type':'application/json','X-Upload-Content-Type':type},body:JSON.stringify({name,parents:[parent]})});
  return shPut(r.headers.get('Location'),blob,type,on);
}
const shPub=id=>gapi(DV+'/'+id+'/permissions?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:'reader',type:'anyone',allowFileDiscovery:false})});
function shCoverBlob(src){return new Promise(res=>{
  if(!src)return res(null);
  const i=new Image();
  i.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=360;const m=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-m)/2,(i.height-m)/2,m,m,0,0,360,360);c.toBlob(b=>res(b),'image/jpeg',.85)}catch(e){res(null)}};
  i.onerror=()=>res(null);i.src=src})}
